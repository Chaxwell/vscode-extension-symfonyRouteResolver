[package]
name = "sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "symfony-route-resolver-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aho-corasick = "1"
mago-syntax = "1"
mago-span = "1"
mago-database = "1"
bumpalo = "3"
